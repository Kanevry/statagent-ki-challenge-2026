[project]
name = "statagent"
version = "0.1.0"
description = "StatAgent (KI Challenge 2026, Use Case 3): agentengestützte Beschäftigtenstatistik, die KI schreibt Code, das Programm rechnet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "plattform",
]

[tool.uv.sources]
plattform = { workspace = true }

[project.scripts]
statagent = "statagent.cli:app"
# Vertrag O/P des PRD: jede UC-CLI ist als `uv run <uc>` aufrufbar.
uc3 = "statagent.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.14",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "daten: braucht die lokale Datenbank mit allen 24 Lieferungen (läuft nicht in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Zeilenlänge regelt `ruff format`; lange Zeilen bleiben nur in SQL-Strings.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
