# agents/ki-challenge-2026: Monorepo (pnpm-Workspace web + shared/ui, uv-Workspace shared/py + uc*).
# Nur MR-Pipelines (plus manuelle Web-Pipelines), kein Deploy. Tests mit LLM_PROVIDER=mock, kein Schlüssel in CI.
# Golden-Set- und DB-Tests mit echten Daten tragen pytest.mark.daten und laufen nur lokal (CI-Postgres ist leer).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

stages: [check, test]

default:
  interruptible: true

.pnpm:
  image: node:24-bookworm-slim
  variables:
    LLM_PROVIDER: mock
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.34.5 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

gitleaks:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    # ganze Historie: Abgabe-Repo ist öffentlich, Schlüssel dürfen nie in einem Commit stehen
    - gitleaks detect --source . --redact --no-banner --exit-code 1

python:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: statistik
    POSTGRES_USER: statistik
    POSTGRES_PASSWORD: statistik
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: statistik
    PGUSER: statistik
    PGPASSWORD: statistik
    # leere Test-DB für Contract-Tests (meta.protokoll, meta.freigabe), keine echten Daten
    PLATTFORM_TEST_DATABASE_URL: postgresql://statistik:statistik@db:5432/statistik
    LLM_PROVIDER: mock
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  script:
    - uv sync --frozen --all-packages
    - uv run python -c "import plattform"
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -q -m "not daten"

web:
  extends: .pnpm
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r exec tsgo --noEmit
    - pnpm -r --if-present run test

web-build:
  extends: .pnpm
  stage: test
  script:
    - pnpm install --frozen-lockfile
    # standalone-Build für den Deploy-Container (#68)
    - pnpm --filter web run build
    - test -f web/.next/standalone/web/server.js

playwright:
  extends: .pnpm
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter web run test:slop
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/playwright-report/
      - web/test-results/
  rules:
    # Anti-Schablonen-Gate (#62) hängt sich mit web/playwright.config.ts ein
    - exists: [web/playwright.config.ts]
