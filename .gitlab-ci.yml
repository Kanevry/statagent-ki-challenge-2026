# agents/ki-challenge-2026: Monorepo (pnpm-Workspace web + shared/ui, uv-Workspace shared/py + uc*).
# Nur MR-Pipelines, plus manuelle Web- und API-Pipelines auf main. Tests mit LLM_PROVIDER=mock, kein Modellschlüssel.
# Deploy nur als manueller Job `deploy` in einer Web- oder API-Pipeline auf main (#68, #111).
# Golden-Set- und DB-Tests mit echten Daten tragen pytest.mark.daten und laufen nur lokal (CI-Postgres ist leer).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    # glab ci run -b main (#111): API-Start nur auf dem Standardzweig, damit der manuelle deploy-Job aus einer
    # Session erreichbar ist
    - if: $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages: [check, test, deploy]

default:
  interruptible: true

.pnpm:
  image: node:24-bookworm-slim
  variables:
    LLM_PROVIDER: mock
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.34.5 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

gitleaks:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    # ganze Historie: Abgabe-Repo ist öffentlich, Schlüssel dürfen nie in einem Commit stehen
    - gitleaks detect --source . --redact --no-banner --exit-code 1

python:
  stage: test
  # nicht -slim: plattform.freigabe und der Protokoll-Export rufen git auf
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: statistik
    POSTGRES_USER: statistik
    POSTGRES_PASSWORD: statistik
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: statistik
    PGUSER: statistik
    PGPASSWORD: statistik
    # leere Test-DB für Contract-Tests (meta.protokoll, meta.freigabe), keine echten Daten
    PLATTFORM_TEST_DATABASE_URL: postgresql://statistik:statistik@db:5432/statistik
    LLM_PROVIDER: mock
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  script:
    - uv sync --frozen --all-packages
    - uv run python -c "import plattform"
    - uv run ruff check .
    - uv run ruff format --check .
    # Typprüfung des gemeinsamen Pakets (UC-Pakete hängen sich mit ihrem Pfad an, z. B. uc3/statagent)
    - uv run mypy shared/py/plattform
    # je UC mit eigener [tool.mypy] in ucN/pyproject.toml, Paketpfad je UC; uc3/statagent auf Antrag der UC3-Lane
    # (lokal grün), greift, sobald das Paket auf dem Branch liegt
    - for e in uc1:uc1 uc2:src uc3:statagent; do d=${e%%:*}; p=${e#*:}; if [ -d "$d/$p" ] && grep -q '^\[tool.mypy\]' "$d/pyproject.toml"; then (cd "$d" && uv run mypy "$p") || exit 1; fi; done
    - uv run pytest -q -m "not daten" shared/py/tests
    # je UC im eigenen Ordner mit eigener pytest-Config (gleichnamige Tests, Paket heißt wie der Ordner)
    - for d in uc1 uc2 uc3; do if [ -d "$d/tests" ]; then (cd "$d" && uv run pytest -q -m "not daten") || exit 1; fi; done

web:
  extends: .pnpm
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r exec tsgo --noEmit
    - pnpm -r --if-present run test

web-build:
  extends: .pnpm
  stage: test
  script:
    - pnpm install --frozen-lockfile
    # standalone-Build für den Deploy-Container (#68)
    - pnpm --filter web run build
    - test -f web/.next/standalone/web/server.js

playwright:
  extends: .pnpm
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  before_script:
    # das Playwright-Image hat Node, aber kein corepack
    - npm install -g pnpm@10.34.5
    - pnpm config set store-dir .pnpm-store
  variables:
    # Harte Prüfung (#102): NOCH_OFFEN muss leer sein und jede Route 200 liefern (docs/design.md)
    ABGABE: "1"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter web run test:slop
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/playwright-report/
      - web/test-results/
  rules:
    # Anti-Schablonen-Gate (#62) hängt sich mit web/playwright.config.ts ein
    - exists: [web/playwright.config.ts]

deploy-check:
  # Prüft die Deploy-Konfiguration ohne Server (#68): shellcheck, Compose-Datei, Caddyfile für beide Inhalte
  stage: check
  image: caddy:2.11-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
  rules:
    - changes: [deploy/**/*, scripts/deploy.sh, .gitlab-ci.yml]
  script:
    - apk add --no-cache bash shellcheck docker-cli-compose jq curl
    - shellcheck -S warning scripts/deploy.sh deploy/methoden-matrix.sh
    - cp -R deploy/caddy/. /etc/caddy/
    # Dummy-Werte, keine echten Zugänge
    - export SITE_ADDRESS=demo.example.org
    - |
      for inhalt in platzhalter app; do
        INHALT=$inhalt caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        echo "caddy validate ok: INHALT=$inhalt"
      done
    # Methodenmatrix der Kante: nur GET/HEAD und POST auf die zwei Frage-Wege kommen durch (Review !94)
    - bash deploy/methoden-matrix.sh
    - printf "SITE_ADDRESS=demo.example.org\nPOSTGRES_PASSWORD=x\nKIC_APP_DB_PASSWORD=x\nLLM_TAGESBUDGET_AUFRUFE=100\n" > /tmp/dummy.env
    - docker compose --env-file /tmp/dummy.env -f deploy/docker-compose.prod.yml config --format json > /tmp/compose.json
    # Invarianten: nur caddy veröffentlicht Ports; Härtung bleibt; die App verbindet sich nie als Superuser
    - jq -e -f deploy/compose-invarianten.jq /tmp/compose.json
    - echo "docker compose config ok, Invarianten erfüllt"

deploy:
  # Online-Deploy (#68): nur manuell und nur in einer Web-Pipeline auf main ("Run pipeline" oder
  # `glab ci run -b main`), erst nach grünen check- und test-Jobs. Images baut der Server, nicht der Runner.
  # Geschützte Projektvariablen: DEPLOY_SSH_KEY_B64 (masked), DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_HOSTNAME,
  # DEPLOY_SSH_USER, DEPLOY_BASIS, DEPLOY_DOMAIN. Der Schlüssel steht auf dem Server mit "restrict".
  stage: deploy
  image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  interruptible: false
  resource_group: online-demo
  environment:
    name: produktion
    url: https://$DEPLOY_DOMAIN
  variables:
    GIT_DEPTH: 1
    DEPLOY_HOST: deploy-ziel
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - apk add --no-cache bash git openssh-client rsync curl coreutils
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - install -d -m 700 ~/.ssh
    - printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - printf 'Host deploy-ziel\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_SSH_HOSTNAME" "$DEPLOY_SSH_USER" > ~/.ssh/config
  script:
    - bash scripts/deploy.sh up
    - bash scripts/deploy.sh pruefen
