# Abnahme #66 (EA-4): frische Datenbank neben einer laufenden Bau-Datenbank.
# Gleiche docker-compose.yml aus dem Startpaket, nur der feste Containername wird ersetzt.
# Aufruf (im Startpaket-Ordner uc3/):
#   DB_PORT=5444 docker compose -p kic-abnahme -f docker-compose.yml -f <dieser Pfad> up -d
# Das Volume heißt dann kic-abnahme_statagent-daten und ist von der Bau-Datenbank getrennt.
services:
  db:
    container_name: kic-abnahme-db
    # Nur Loopback: Das Startpaket veröffentlicht den Port auf allen Adressen, mit festem Passwort (Entscheid #92).
    ports: !override
      - "127.0.0.1:${DB_PORT:-5444}:5432"
    # Grenzen des Ersatzrechners, aus abnahme.env; 0 heißt ohne Grenze.
    cpus: ${ABNAHME_DB_CPUS:-0}
    mem_limit: ${ABNAHME_DB_MEM:-0}
