# --- 91-1: README

[[pruefung]]
id = "91-1"
hash = "fa351bccf5"
befehl = '''uv run --isolated --package plattform python -I -c '
import re
t = open("README.md", encoding="utf-8").read()
P = ["Lösung und Ansatz", "Ausführung", "Abhängigkeiten und Voraussetzungen", "Konfiguration", "Grenzen und offene Punkte", "Vorab Entstandenes", "Lizenzen"]
ok = 0
for p in P:
    m = re.search(r"^## " + re.escape(p) + r"\n(.*?)(?=^## |\Z)", t, re.S | re.M)
    if m and len([z for z in m.group(1).splitlines() if z.strip()]) >= 3:
        ok += 1
print("readme_abschnitte", ok)
r = open("docs/abgabe/readme-pruefung.md", encoding="utf-8").read()
links = set(re.findall(r"README\.md#([^)\]]+)", r))
print("pruefung_links", sum(1 for p in P if p.lower().replace(" ", "-") in links))
print("pruefung_7von7", "7 von 7" in r or "7/7" in r)
'; test -f .env.example && echo "env_example da"; timeout 150 uv run --isolated --package statagent statagent lauf --help >/dev/null 2>&1; echo "lauf_hilfe_exit $?"'''
erwartet = ["^readme_abschnitte 7$", "^pruefung_links 7$", "^pruefung_7von7 True$", "^env_example da$", "^lauf_hilfe_exit 0$"]
deckung = "teil"
schwer = false
zeitlimit = 170
quelle = "Issue #91 Kriterium (Wortlaut): 7 Pflichtabschnitte, readme-pruefung.md mit 7/7 und Abschnittslink"
befund = "Im README fehlt einer der sieben Pflichtabschnitte oder er hat weniger als drei Zeilen, oder readme-pruefung.md führt nicht 7/7 mit Abschnittslinks."
grund = "Alle sieben Pflichtabschnitte stehen im README mit Inhalt, readme-pruefung.md verlinkt alle sieben und meldet 7/7; die Start-Hilfe läuft mit Exit 0."

