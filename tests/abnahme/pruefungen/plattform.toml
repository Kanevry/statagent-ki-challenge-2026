beschreibung = "Ein Mensch öffnet /uc4 (Desktop 1440 und Mobil 390), stellt eine Frage im Testmodus und prüft: (1) Blickführung: die Hauptaussage steht oben und die nächste Handlung (Frage-Feld) ist sofort erkennbar; (2) Kontrast von Text und Chips mindestens 4,5:1 (zum Beispiel mit dem Browser-Werkzeug für Kontrast); (3) alles Wesentliche ist allein mit Tab, Enter und Esc bedienbar, der Fokus ist sichtbar; (4) ein axe-Lauf (Browser-Erweiterung oder @axe-core/playwright) meldet 0 critical und 0 serious."
quelle = "Issue #98 Kriterium (Wortlaut): Owner-Vorgabe Blickführung, Kontrast >= 4,5:1, Tastatur; Orakel axe"
befund = "Blickführung und Tastaturbedienung sind nicht automatisch messbar; axe wurde nicht ausgeführt."
grund = "Ein Mensch bestätigt Blickführung, Kontrast, Tastatur und axe 0 critical/serious."
