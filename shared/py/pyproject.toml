[project]
name = "plattform"
version = "0.1.0"
description = "Gemeinsames Fundament: Modell-Schalter, Protokoll, Freigabe, Voice, Embeddings"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0",
  "pydantic>=2.11",
  "python-dotenv>=1.1",
  "psycopg[binary]>=3.2",
  "jsonschema>=4.25",
  "fastapi>=0.120",
  "uvicorn>=0.38",
  "httpx>=0.28",
]

[project.optional-dependencies]
# Nur lokal (M4/m5), nicht in CI: torch macht jede Pipeline Minuten länger (#67).
embeddings = ["sentence-transformers>=5.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plattform"]
