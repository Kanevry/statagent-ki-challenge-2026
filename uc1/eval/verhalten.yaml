# Phrasenlisten für `klassifiziere_verhalten` (uc1/uc1/eval.py), Issue #30.
#
# Das Verhalten wird aus dem Antworttext bestimmt, nie aus einem Selbst-Etikett des Modells.
# Vergleich: Kleinschreibung, Leerraum zusammengezogen, typografische Zeichen normiert; eine
# Phrase zählt, wenn sie als Teilstring vorkommt.
# Reihenfolge der Prüfung: abstinenz vor uebergabe vor antwort. Wer offen sagt, dass er es
# nicht belegen kann, und dann weiterverweist, zählt als Abstinenz; wer ohne Eingeständnis nur
# weiterverweist, als Übergabe; alles andere als Antwort.
# Änderungen nur mit Begründung im Issue, weil sie die Messung verschieben.

