    persona: "Monika, geboren 12.09.1966, Wien"
    frage: "Wann kann ich in Regelpension gehen?"
    sprache: de
    erwarteter_traeger: PVA
    # Falle: Die Fassung von ASVG § 253 im Korpus nennt für Frauen noch das 60. Lebensjahr;
    # die Anhebung steht in Altersgrenzen-BVG § 3 (ab 2024 jährlich um sechs Monate).
    erwartete_quellen:
      - {gesetz: ASVG, art: PARA, nummer: "253"}
      - {gesetz: Altersgrenzen-BVG, art: PARA, nummer: "3"}
    verhalten_soll: [antwort, uebergabe]
    grenze: false
    soll_text: "Für Jahrgang 1966 nicht 65: geboren 01.07. bis 31.12.1966 mit 63 Jahren, Regelpension ab 01.10.2029; kein falsches Alter; Verweis auf Pensionskonto/Rechner."
    belegt_durch:
      - "Rechtstexte/ASVG=PARA=253=71=2003-08-20=2004-07-01.xml"
      - "Rechtstexte/Altersgrenzen-BVG=PARA=3=832=1992-12-29=1993-01-01.xml"

