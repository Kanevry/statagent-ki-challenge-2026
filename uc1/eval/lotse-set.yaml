# Lotse-Set: eingefrorenes Messset für UC1 KI-Lotse (Issue #30)
#
# Herkunft: Vault-Notiz uc1-ki-lotse-recherche.md, § 7 "Golden Set: 25 synthetische
# Versichertenfragen". Fragen der Golden-Fälle stehen im Original-Wortlaut. Szenarien und
# Grenzfragen sind selbst formuliert. Alle Personas sind erfunden.
# Eingefroren: 2026-11-05, vor Abstimmung der Suche und vor dem Lotse-Kern (#31).
# Das Soll stammt nur aus Golden Set und Gesetzestext im Korpus, nie aus Suchergebnissen.
# REGEL: Nach dem Commit nur mit Begründung im Issue ändern (Issue-Nummer im Commit nennen).
#
# Zählung (prüft `lotse eval --pruefe-set`):
#   golden   13 Einträge = 12 Golden-Fälle (2, 3, 5, 6, 7, 10, 18, 20, 21, 23, 24, 25),
#            Fall 24 als Paar mit zwei Einträgen (24a Michael, 24b Mehmet)
#   web       4 Einträge (Fälle 1, 15, 19, 22; Hauptquelle Webseite, gehört zu E4)
#   szenario  2 Einträge (Pflege, Case Manager)
#   grenze    8 Einträge (selbst formulierte Grenzfragen; Fall 23 zählt unter golden)
#   gesamt   27 Einträge
#
# Schema je Fall:
#   id                 str, eindeutig
#   art                golden | web | szenario | grenze
#   golden_nr          int oder null (Nummer in § 7)
#   persona            str (erfunden)
#   frage              str (Golden: Original-Wortlaut)
#   vorspann           optional str: Text, den der Lauf vor die Frage stellt (nur Paar 24,
#                      damit der Name beim Modell ankommt; die Frage bleibt im Wortlaut)
#   sprache            de | en
#   erwarteter_traeger str oder null (ÖGK, SVS, PVA, AUVA, ...)
#   erwartete_quellen  Liste; Rechtstext {gesetz, art, nummer}, PDF {datei, seite?}.
#                      datei ist relativ zu UC1_DATA_DIR. Jede Fassung desselben § zählt.
#                      Treffer@k = mindestens eine dieser Quellen unter den Top-k.
#                      Leere Liste: Quelle nicht im Korpus, Fall zählt nicht im Recall.
#   verhalten_soll     antwort | abstinenz | uebergabe, oder Liste davon (jede zählt)
#   grenze             bool (medizinische Grenze: keine Diagnose, Verweis Ärztin/Arzt, 1450, 144)
#   paar               optional str: Paar-Kennung (Fall 24), gleiche Quellenmenge erwartet
#   soll_text          kurz, aus dem Golden Set
#   belegt_durch       Liste von Dateien relativ zu UC1_DATA_DIR, die die Quellen belegen
#   Optional nur Szenarien:
#     max_rueckfragen    int
#     rueckfragen_pflicht Liste von Themen, nach denen gefragt werden muss
#     buendel            Liste von Gruppen; aus jeder Gruppe muss mindestens eine Quelle belegt sein
#     nicht_erwartet     Quellen, die nicht als Antwort kommen dürfen
#   Optional: leichte_sprache bool (Fall 25, mittlere Satzlänge wird gemessen)

