  - id: fsw-u
    abschnitt_id: 72836
    kontext: "fsw-antrag-auf-foerderung-von-leistungen.1779095804 S. 1"
    zitat: "Antrag auf Förderung von Leistungen 1. Förderung Ich beantrage eine Förderung für Leistungen Pflege und Betreuung"
    aussage: "Der Fonds Soziales Wien zahlt die Pflege zu Hause vollständig und ohne Einkommensprüfung."
