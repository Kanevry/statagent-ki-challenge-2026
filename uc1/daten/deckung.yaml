    zitat: "Antrag auf Förderung von Leistungen 1. Förderung Ich beantrage eine Förderung für Leistungen Pflege und Betreuung"
    aussage: "Beim Fonds Soziales Wien beantragen Sie eine Förderung für Leistungen der Pflege und Betreuung."
