# Textbausteine des Lotsen (Issue #31), je Sprache. Platzhalter in {geschweiften} Klammern füllt uc1.kern.
# Owner-Vorgabe: Bürgersprache, kurze Sätze (im Mittel unter 15 Wörtern), Nutzen zuerst, keine Floskeln,
# keine Gedankenstriche. Jede Aussage trägt ihre Quelle im Halbsatz, z. B. „(BPGG § 4)“; Zitat und Stand der
# Fassung stehen in aussagen/belege („Beleg anzeigen“). Test: tests/test_sprache.py.
# Die Phrasen „keinen Beleg“ und „wenden Sie sich an“ tragen die Verhaltensklasse für eval/verhalten.yaml.

de:
  quelle: "Quelle: {schluessel}"
  halbsatz: "({schluessel})"
  # Beträge: Stand kurz im Halbsatz. Alte Fassung (vor 2026) oder ohne Stand: Hinweis „heute vielleicht höher“.
  halbsatz_betrag: "({schluessel}, Stand {jahr})"
  halbsatz_betrag_alt: "({schluessel}, Stand {jahr}, heute vielleicht höher)"
  halbsatz_betrag_ohne: "({schluessel}, Stand unbekannt)"
  hinweis_hoehe: "Den aktuellen Betrag nennt Ihnen der Träger."
  zustaendig: "Zuständig: {name} ({fundstelle})."
  schritte: "So geht es weiter:"
  schritt_formular: "Stellen Sie den {bezeichnung}."
  schritt_unterlage: "Legen Sie {text} bei ({quelle})."
  schritt_antrag: "Ich kann den Antrag für Sie vorausfüllen. Abgeschickt wird nichts."
  schritt_angebot: "Hilfe im Alltag: {schluessel}."
  schritt_stelle: "Fragen klären Sie direkt mit: {name}."
  vorbehalt: "Mir fehlen noch Angaben: {felder}. Darum ist die Auskunft allgemein."
  abstinenz: "Dazu habe ich keinen Beleg in meinen Quellen. Ich will Ihnen nichts Falsches sagen."
  uebergabe: "Bitte wenden Sie sich an die {name}."
  uebergabe_beratung: "Bitte wenden Sie sich an Ihre Sozialversicherung oder an eine Sozialberatung."
  modell_aus: "Die Antwort-KI ist gerade nicht erreichbar."
  ki_hinweis: "Diese Auskunft kommt von einem KI-Lotsen. Die Entscheidung trifft der Träger."
en:
  quelle: "Source: {schluessel}"
  halbsatz: "({schluessel})"
  halbsatz_betrag: "({schluessel}, as of {jahr})"
  halbsatz_betrag_alt: "({schluessel}, as of {jahr}, may be higher today)"
  halbsatz_betrag_ohne: "({schluessel}, date unknown)"
  hinweis_hoehe: "Your insurance provider can tell you the current amount."
  zustaendig: "Responsible: {name} ({fundstelle})."
  schritte: "Next steps:"
  schritt_formular: "Apply with the form {bezeichnung}."
  schritt_unterlage: "Attach: {text} ({quelle})."
  schritt_antrag: "I can pre-fill the form for you. Nothing is sent."
  schritt_angebot: "Help at home: {schluessel}."
  schritt_stelle: "For questions, contact: {name}."
  vorbehalt: "Some details are still missing: {felder}. So this answer is general."
  abstinenz: "I have no reliable source for this in my documents. I do not want to tell you anything wrong."
  uebergabe: "Please contact {name}."
  uebergabe_beratung: "Please contact your social insurance provider or a social counselling service."
  modell_aus: "The answer service is not reachable right now."
  ki_hinweis: "This answer comes from an AI guide. The insurance provider makes the decision."
