[project]
name = "uc1"
version = "0.1.0"
description = "UC1 SV KI-Lotse: Korpus, Suche und Lotse-Kern (KI Challenge 2026)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "psycopg[binary]>=3.2",
  "pypdf>=5",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Embeddings (google/embeddinggemma-2) nur bei Bedarf: `uv sync --extra embed`.
# CI und Volltext-Suche brauchen torch nicht.
embed = [
  "sentence-transformers>=5",
  "torch>=2.8",
  "transformers>=4.57",
]

[project.scripts]
lotse = "uc1.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "ruff>=0.8",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uc1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "daten: braucht UC1_DATA_DIR (svbox/uc1) und die lokale DB lotse",
  "modell: braucht das Embedding-Modell im Hugging-Face-Cache",
]
